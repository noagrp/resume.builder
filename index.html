<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Builder</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM Development CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel Standalone for JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    @media print {
      /* Hide everything on the page by default when printing */
      body * {
        visibility: hidden;
      }
      
      /* Show only the targeted printable resume container and its children */
      #printable-resume, #printable-resume * {
        visibility: visible;
      }
      
      /* Reset layout positioning to fill the printed page cleanly */
      #printable-resume {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: white !important;
        color: black !important;
        box-shadow: none !important;
        border: none !important;
      }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const INITIAL_STATE = {
      personalInfo: {
        fullName: "Noan Li",
        email: "noanli@example.com",
        phone: "+6016-541xxxx",
        location: "Api-Api, Sabah.",
        photoUrl: "",
        customFields: [
          { label: "Portfolio", value: "https://alexmorgan.dev" }
        ]
      },
      sections: {
        experience: [
          {
            id: "exp-1",
            title: "Senior Frontend Engineer",
            company: "TechFlow Inc.",
            startDate: "2022-03",
            endDate: "Present",
            description: "Spearheaded migration to Next.js, cutting bundle size by 40% and improving Core Web Vitals.",
            customFields: [{ label: "Team Size", value: "6 Developers" }]
          }
        ],
        academy: [
          {
            id: "edu-1",
            degree: "B.S. in Computer Science",
            institution: "University of California, Berkeley",
            startDate: "2018",
            endDate: "2022",
            description: "Graduated with Honors. Focus on Human-Computer Interaction.",
            customFields: [{ label: "GPA", value: "3.8 / 4.0" }]
          }
        ],
        skills: [
          { id: "skl-1", name: "JavaScript / TypeScript", category: "Languages", customFields: [] },
          { id: "skl-2", name: "React, Next.js, Tailwind CSS", category: "Frontend", customFields: [] }
        ],
        hobbies: [
          { id: "hob-1", name: "Open Source Contributing", customFields: [] },
          { id: "hob-2", name: "Rock Climbing & Photography", customFields: [] }
        ]
      },
      customSections: []
    };

    function SectionEditor({ title, emoji, items, sectionKey, onAdd, onUpdate, onRemove, onAddCF, onUpdateCF, onRemoveCF, fields }) {
      return (
        <div className="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-sm space-y-4">
          <div className="flex items-center justify-between">
            <h2 className="text-md font-semibold flex items-center gap-2 text-indigo-400">
              <span>{emoji}</span> {title}
            </h2>
            <button 
              onClick={() => onAdd(sectionKey)}
              className="flex items-center gap-1 text-xs bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-3 py-1.5 rounded-lg transition"
            >
              ➕ Add New Entry
            </button>
          </div>

          <div className="space-y-4">
            {items.map((item, index) => (
              <div key={item.id} className="bg-slate-900 border border-slate-700/80 rounded-lg p-4 space-y-3 relative">
                <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                  <span className="text-xs font-semibold text-slate-400">Entry #{index + 1}</span>
                  <button onClick={() => onRemove(sectionKey, item.id)} className="text-red-400 hover:text-red-300 text-xs flex items-center gap-1">
                    🗑️ Remove Entry
                  </button>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {fields.map((f) => (
                    <div key={f.name} className={f.textarea ? "sm:col-span-2" : ""}>
                      <label className="text-xs text-slate-400 block mb-1">{f.label}</label>
                      {f.textarea ? (
                        <textarea 
                          rows="2"
                          placeholder={f.placeholder}
                          value={item[f.name] || ''}
                          onChange={(e) => onUpdate(sectionKey, item.id, f.name, e.target.value)}
                          className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
                        />
                      ) : (
                        <input 
                          type="text"
                          placeholder={f.placeholder}
                          value={item[f.name] || ''}
                          onChange={(e) => onUpdate(sectionKey, item.id, f.name, e.target.value)}
                          className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
                        />
                      )}
                    </div>
                  ))}
                </div>

                <div className="pt-2 border-t border-slate-800 space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="text-xs text-slate-400">Custom Sub-Fields</span>
                    <button onClick={() => onAddCF(sectionKey, item.id)} className="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1">
                      ➕ Add Field
                    </button>
                  </div>
                  {item.customFields && item.customFields.map((cf, cfIndex) => (
                    <div key={cfIndex} className="flex items-center gap-2">
                      <input 
                        type="text" 
                        placeholder="Field Label (e.g. Level)" 
                        value={cf.label} 
                        onChange={(e) => onUpdateCF(sectionKey, item.id, cfIndex, 'label', e.target.value)}
                        className="w-1/3 bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1 text-xs focus:outline-none focus:border-indigo-500"
                      />
                      <input 
                        type="text" 
                        placeholder="Field Value (e.g. Expert)" 
                        value={cf.value} 
                        onChange={(e) => onUpdateCF(sectionKey, item.id, cfIndex, 'value', e.target.value)}
                        className="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1 text-xs focus:outline-none focus:border-indigo-500"
                      />
                      <button onClick={() => onRemoveCF(sectionKey, item.id, cfIndex)} className="text-red-400 hover:text-red-300 p-1">
                        🗑️
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function ResumeBuilder() {
      const [resumeData, setResumeData] = useState(() => {
        const saved = localStorage.getItem('local_resume_data');
        return saved ? JSON.parse(saved) : INITIAL_STATE;
      });

      const [showHelpModal, setShowHelpModal] = useState(false);
      const fileInputRef = useRef(null);
      const loadFileInputRef = useRef(null);
      const photoInputRef = useRef(null);

      useEffect(() => {
        localStorage.setItem('local_resume_data', JSON.stringify(resumeData));
      }, [resumeData]);

      const handleCreateNew = () => {
        if (window.confirm("Are you sure you want to create a new resume? Any unsaved changes in your current session will be replaced.")) {
          setResumeData(INITIAL_STATE);
          localStorage.removeItem('local_resume_data');
        }
      };

      const handleTriggerLoadOld = () => {
        loadFileInputRef.current?.click();
      };

      const handleLoadOldFile = (e) => {
        const fileReader = new FileReader();
        if (e.target.files && e.target.files[0]) {
          fileReader.readAsText(e.target.files[0], "UTF-8");
          fileReader.onload = (event) => {
            try {
              const parsedData = JSON.parse(event.target.result);
              setResumeData(parsedData);
              alert("Old resume backup successfully loaded!");
            } catch (error) {
              alert("Invalid JSON backup file format.");
            }
          };
        }
        e.target.value = '';
      };

      const handlePersonalInfoChange = (e) => {
        const { name, value } = e.target;
        setResumeData(prev => ({
          ...prev,
          personalInfo: { ...prev.personalInfo, [name]: value }
        }));
      };

      const handlePhotoUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setResumeData(prev => ({
              ...prev,
              personalInfo: { ...prev.personalInfo, photoUrl: reader.result }
            }));
          };
          reader.readAsDataURL(file);
        }
      };

      const handleRemovePhoto = () => {
        setResumeData(prev => ({
          ...prev,
          personalInfo: { ...prev.personalInfo, photoUrl: "" }
        }));
        if (photoInputRef.current) photoInputRef.current.value = "";
      };

      const addPersonalCustomField = () => {
        setResumeData(prev => ({
          ...prev,
          personalInfo: {
            ...prev.personalInfo,
            customFields: [...prev.personalInfo.customFields, { label: '', value: '' }]
          }
        }));
      };

      const updatePersonalCustomField = (index, field, val) => {
        const updated = [...resumeData.personalInfo.customFields];
        updated[index][field] = val;
        setResumeData(prev => ({
          ...prev,
          personalInfo: { ...prev.personalInfo, customFields: updated }
        }));
      };

      const removePersonalCustomField = (index) => {
        setResumeData(prev => ({
          ...prev,
          personalInfo: {
            ...prev.personalInfo,
            customFields: prev.personalInfo.customFields.filter((_, i) => i !== index)
          }
        }));
      };

      const addItem = (sectionKey) => {
        const newItemId = 'item-' + Date.now();
        let template = { id: newItemId, customFields: [] };
        
        if (sectionKey === 'experience') {
          template = { ...template, title: '', company: '', startDate: '', endDate: '', description: '' };
        } else if (sectionKey === 'academy') {
          template = { ...template, degree: '', institution: '', startDate: '', endDate: '', description: '' };
        } else if (sectionKey === 'skills') {
          template = { ...template, name: '', category: '' };
        } else if (sectionKey === 'hobbies') {
          template = { ...template, name: '' };
        }

        setResumeData(prev => ({
          ...prev,
          sections: {
            ...prev.sections,
            [sectionKey]: [...prev.sections[sectionKey], template]
          }
        }));
      };

      const updateItem = (sectionKey, id, field, value) => {
        setResumeData(prev => ({
          ...prev,
          sections: {
            ...prev.sections,
            [sectionKey]: prev.sections[sectionKey].map(item => 
              item.id === id ? { ...item, [field]: value } : item
            )
          }
        }));
      };

      const removeItem = (sectionKey, id) => {
        setResumeData(prev => ({
          ...prev,
          sections: {
            ...prev.sections,
            [sectionKey]: prev.sections[sectionKey].filter(item => item.id !== id)
          }
        }));
      };

      const addItemCustomField = (sectionKey, itemId) => {
        setResumeData(prev => ({
          ...prev,
          sections: {
            ...prev.sections,
            [sectionKey]: prev.sections[sectionKey].map(item => {
              if (item.id === itemId) {
                return {
                  ...item,
                  customFields: [...(item.customFields || []), { label: '', value: '' }]
                };
              }
              return item;
            })
          }
        }));
      };

      const updateItemCustomField = (sectionKey, itemId, cfIndex, field, value) => {
        setResumeData(prev => ({
          ...prev,
          sections: {
            ...prev.sections,
            [sectionKey]: prev.sections[sectionKey].map(item => {
              if (item.id === itemId) {
                const updatedCF = [...(item.customFields || [])];
                updatedCF[cfIndex][field] = value;
                return { ...item, customFields: updatedCF };
              }
              return item;
            })
          }
        }));
      };

      const removeItemCustomField = (sectionKey, itemId, cfIndex) => {
        setResumeData(prev => ({
          ...prev,
          sections: {
            ...prev.sections,
            [sectionKey]: prev.sections[sectionKey].map(item => {
              if (item.id === itemId) {
                return {
                  ...item,
                  customFields: (item.customFields || []).filter((_, i) => i !== cfIndex)
                };
              }
              return item;
            })
          }
        }));
      };

      const handleDownloadBackup = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(resumeData, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `resume_backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const handleUploadBackup = (e) => {
        const fileReader = new FileReader();
        if (e.target.files && e.target.files[0]) {
          fileReader.readAsText(e.target.files[0], "UTF-8");
          fileReader.onload = (event) => {
            try {
              const parsedData = JSON.parse(event.target.result);
              setResumeData(parsedData);
              alert("Backup successfully restored!");
            } catch (error) {
              alert("Invalid JSON backup file.");
            }
          };
        }
      };

      const handlePrintPDF = () => {
        window.print();
      };

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col">
          
          {/* Header Navigation */}
          <header className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-20 print:hidden">
            <div className="flex items-center gap-3">
              <div className="bg-indigo-600 p-2 rounded-lg text-white text-xl">
                📄
              </div>
              <div>
                <h1 className="text-xl font-bold tracking-tight">Resume Builder</h1>
                <p className="text-xs text-slate-400">Our Local-First Resume Builder is designed to give you absolute privacy, speed, and complete control over your professional profile without ever requiring you to create an account or store your data on remote servers. Everything you type, upload, or customize stays strictly on your own device using local storage, ensuring that sensitive personal details never leave your browser. With a clean, lightweight, and device-friendly interface, it adapts seamlessly to your mobile phone, tablet, or desktop, allowing you to build, update, and manage your resume on the go. When you are ready, a single tap lets you instantly preview and download a clean, professional PDF without any watermarks, annoying ads, or hidden fees.</p>
              </div>
            </div>

            <div className="flex items-center flex-wrap gap-2">
              <div className="flex items-center bg-slate-900 border border-slate-700 rounded-lg p-1 mr-2 gap-1">
                <button 
                  onClick={handleCreateNew}
                  className="flex items-center gap-1.5 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold rounded-md text-white transition"
                >
                  📄 Create New
                </button>
                <button 
                  onClick={handleTriggerLoadOld}
                  className="flex items-center gap-1.5 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-medium rounded-md text-slate-200 transition"
                >
                  📂 Load Old
                </button>
                <input 
                  type="file" 
                  ref={loadFileInputRef} 
                  onChange={handleLoadOldFile} 
                  accept=".json" 
                  className="hidden" 
                />
              </div>

              <button 
                onClick={() => setShowHelpModal(true)}
                className="flex items-center gap-1.5 px-3 py-2 bg-slate-700 hover:bg-slate-600 text-sm font-medium rounded-lg transition"
              >
                ❓ Guide
              </button>

              <button 
                onClick={handleDownloadBackup}
                className="flex items-center gap-1.5 px-3 py-2 bg-slate-700 hover:bg-slate-600 text-sm font-medium rounded-lg transition"
              >
                💾 Export Backup
              </button>

              <label className="flex items-center gap-1.5 px-3 py-2 bg-slate-700 hover:bg-slate-600 text-sm font-medium rounded-lg transition cursor-pointer">
                📥 Restore JSON
                <input 
                  type="file" 
                  ref={fileInputRef} 
                  onChange={handleUploadBackup} 
                  accept=".json" 
                  className="hidden" 
                />
              </label>

              <button 
                onClick={handlePrintPDF}
                className="flex items-center gap-1.5 px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-sm font-semibold text-white rounded-lg shadow transition"
              >
                🖨️ Download PDF / Print
              </button>
            </div>
          </header>

          {/* Main Layout */}
          <div className="flex-1 grid grid-cols-1 lg:grid-cols-12 max-w-[1600px] w-full mx-auto p-4 lg:p-6 gap-6">
            
            {/* Editor Panel */}
            <div className="lg:col-span-6 space-y-6 print:hidden">
              
              {/* Basic Info */}
              <div className="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-sm space-y-4">
                <h2 className="text-md font-semibold flex items-center gap-2 text-indigo-400">
                  👤 Basic Information & Photo
                </h2>

                <div className="bg-slate-900 border border-slate-700/80 rounded-lg p-4 flex items-center gap-4">
                  <div className="w-16 h-16 rounded-full bg-slate-800 border border-slate-700 overflow-hidden flex items-center justify-center shrink-0">
                    {resumeData.personalInfo.photoUrl ? (
                      <img src={resumeData.personalInfo.photoUrl} alt="Avatar" className="w-full h-full object-cover" />
                    ) : (
                      <span className="text-2xl">📷</span>
                    )}
                  </div>
                  <div className="flex-1 space-y-2">
                    <label className="text-xs text-slate-400 block">Profile Photo (Passport size recommended)</label>
                    <div className="flex items-center gap-2">
                      <label className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg cursor-pointer transition">
                        Upload Photo
                        <input 
                          type="file" 
                          ref={photoInputRef}
                          onChange={handlePhotoUpload} 
                          accept="image/*" 
                          className="hidden" 
                        />
                      </label>
                      {resumeData.personalInfo.photoUrl && (
                        <button 
                          onClick={handleRemovePhoto}
                          className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-red-400 text-xs font-medium rounded-lg transition"
                        >
                          Remove
                        </button>
                      )}
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Full Name</label>
                    <input 
                      type="text" 
                      name="fullName" 
                      value={resumeData.personalInfo.fullName} 
                      onChange={handlePersonalInfoChange}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Email Address</label>
                    <input 
                      type="email" 
                      name="email" 
                      value={resumeData.personalInfo.email} 
                      onChange={handlePersonalInfoChange}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Phone Number</label>
                    <input 
                      type="text" 
                      name="phone" 
                      value={resumeData.personalInfo.phone} 
                      onChange={handlePersonalInfoChange}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Location</label>
                    <input 
                      type="text" 
                      name="location" 
                      value={resumeData.personalInfo.location} 
                      onChange={handlePersonalInfoChange}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                </div>

                <div className="pt-2 space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-medium text-slate-400">Custom Contact Fields</span>
                    <button onClick={addPersonalCustomField} className="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1">
                      ➕ Add Field
                    </button>
                  </div>
                  {resumeData.personalInfo.customFields.map((cf, idx) => (
                    <div key={idx} className="flex items-center gap-2">
                      <input 
                        type="text" 
                        placeholder="Label (e.g. Portfolio)" 
                        value={cf.label} 
                        onChange={(e) => updatePersonalCustomField(idx, 'label', e.target.value)}
                        className="w-1/3 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-indigo-500"
                      />
                      <input 
                        type="text" 
                        placeholder="Value (e.g. https://alex.dev)" 
                        value={cf.value} 
                        onChange={(e) => updatePersonalCustomField(idx, 'value', e.target.value)}
                        className="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-indigo-500"
                      />
                      <button onClick={() => removePersonalCustomField(idx)} className="text-red-400 hover:text-red-300 p-1">
                        🗑️
                      </button>
                    </div>
                  ))}
                </div>
              </div>

              {/* Sections Editors */}
              <SectionEditor 
                title="Work Experience" 
                emoji="💼"
                items={resumeData.sections.experience}
                sectionKey="experience"
                onAdd={addItem}
                onUpdate={updateItem}
                onRemove={removeItem}
                onAddCF={addItemCustomField}
                onUpdateCF={updateItemCustomField}
                onRemoveCF={removeItemCustomField}
                fields={[
                  { name: 'title', label: 'Job Title', placeholder: 'Software Engineer' },
                  { name: 'company', label: 'Company', placeholder: 'Acme Corp' },
                  { name: 'startDate', label: 'Start Date', placeholder: 'Jan 2021' },
                  { name: 'endDate', label: 'End Date', placeholder: 'Present' },
                  { name: 'description', label: 'Description & Achievements', placeholder: 'Built scalable APIs...', textarea: true }
                ]}
              />

              <SectionEditor 
                title="Academy & Education" 
                emoji="🎓"
                items={resumeData.sections.academy}
                sectionKey="academy"
                onAdd={addItem}
                onUpdate={updateItem}
                onRemove={removeItem}
                onAddCF={addItemCustomField}
                onUpdateCF={updateItemCustomField}
                onRemoveCF={removeItemCustomField}
                fields={[
                  { name: 'degree', label: 'Degree / Program', placeholder: 'B.S. Computer Science' },
                  { name: 'institution', label: 'Institution', placeholder: 'University Name' },
                  { name: 'startDate', label: 'Start Year', placeholder: '2017' },
                  { name: 'endDate', label: 'End Year', placeholder: '2021' },
                  { name: 'description', label: 'Details', placeholder: 'Relevant coursework...', textarea: true }
                ]}
              />

              <SectionEditor 
                title="Skills" 
                emoji="🛠️"
                items={resumeData.sections.skills}
                sectionKey="skills"
                onAdd={addItem}
                onUpdate={updateItem}
                onRemove={removeItem}
                onAddCF={addItemCustomField}
                onUpdateCF={updateItemCustomField}
                onRemoveCF={removeItemCustomField}
                fields={[
                  { name: 'name', label: 'Skill Name', placeholder: 'React, Python, Project Management' },
                  { name: 'category', label: 'Category', placeholder: 'Frontend / Languages' }
                ]}
              />

              <SectionEditor 
                title="Hobbies & Interests" 
                emoji="🎯"
                items={resumeData.sections.hobbies}
                sectionKey="hobbies"
                onAdd={addItem}
                onUpdate={updateItem}
                onRemove={removeItem}
                onAddCF={addItemCustomField}
                onUpdateCF={updateItemCustomField}
                onRemoveCF={removeItemCustomField}
                fields={[
                  { name: 'name', label: 'Interest / Hobby', placeholder: 'Reading, Hiking' }
                ]}
              />

            </div>

            {/* Live Preview Panel */}
            <div className="lg:col-span-6">
              <div className="sticky top-24 bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg">
                <div className="flex items-center justify-between mb-3 pb-2 border-b border-slate-700 print:hidden">
                  <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">Live Preview Sheet</span>
                  <span className="text-xs text-emerald-400 flex items-center gap-1 font-medium">
                    ✅ Auto-saved locally
                  </span>
                </div>

                <div id="printable-resume" className="bg-white text-slate-900 p-8 rounded shadow-inner min-h-[750px] font-sans text-sm selection:bg-indigo-100">
                  
                  <div className="border-b border-slate-300 pb-4 mb-5 flex items-center justify-between gap-4">
                    <div>
                      <h2 className="text-2xl font-extrabold tracking-tight text-slate-900">
                        {resumeData.personalInfo.fullName || "Your Name"}
                      </h2>
                      <div className="flex flex-wrap items-center gap-x-4 gap-y-1 mt-2 text-xs text-slate-600">
                        {resumeData.personalInfo.email && <span>{resumeData.personalInfo.email}</span>}
                        {resumeData.personalInfo.phone && <span>• {resumeData.personalInfo.phone}</span>}
                        {resumeData.personalInfo.location && <span>• {resumeData.personalInfo.location}</span>}
                        {resumeData.personalInfo.customFields.map((cf, i) => (
                          cf.label && <span key={i}>• {cf.label}: {cf.value}</span>
                        ))}
                      </div>
                    </div>

                    {resumeData.personalInfo.photoUrl && (
                      <div className="w-20 h-20 rounded-md overflow-hidden border border-slate-300 shrink-0 bg-slate-100">
                        <img src={resumeData.personalInfo.photoUrl} alt="Profile" className="w-full h-full object-cover" />
                      </div>
                    )}
                  </div>

                  {resumeData.sections.experience.length > 0 && (
                    <div className="mb-5">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-indigo-700 border-b border-indigo-200 pb-1 mb-3">
                        Work Experience
                      </h3>
                      <div className="space-y-4">
                        {resumeData.sections.experience.map((exp) => (
                          <div key={exp.id}>
                            <div className="flex justify-between items-baseline font-semibold text-slate-900">
                              <span>{exp.title} {exp.company && <span className="font-normal text-slate-700">at {exp.company}</span>}</span>
                              <span className="text-xs font-normal text-slate-500">{exp.startDate} {exp.endDate && `- ${exp.endDate}`}</span>
                            </div>
                            {exp.description && <p className="text-xs text-slate-700 mt-1 whitespace-pre-line">{exp.description}</p>}
                            {exp.customFields && exp.customFields.map((cf, cidx) => (
                              cf.label && <div key={cidx} className="text-xs text-slate-600 mt-0.5"><span className="font-medium">{cf.label}:</span> {cf.value}</div>
                            ))}
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {resumeData.sections.academy.length > 0 && (
                    <div className="mb-5">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-indigo-700 border-b border-indigo-200 pb-1 mb-3">
                        Academy & Education
                      </h3>
                      <div className="space-y-3">
                        {resumeData.sections.academy.map((edu) => (
                          <div key={edu.id}>
                            <div className="flex justify-between items-baseline font-semibold text-slate-900">
                              <span>{edu.degree} {edu.institution && <span className="font-normal text-slate-700">| {edu.institution}</span>}</span>
                              <span className="text-xs font-normal text-slate-500">{edu.startDate} {edu.endDate && `- ${edu.endDate}`}</span>
                            </div>
                            {edu.description && <p className="text-xs text-slate-700 mt-1">{edu.description}</p>}
                            {edu.customFields && edu.customFields.map((cf, cidx) => (
                              cf.label && <div key={cidx} className="text-xs text-slate-600 mt-0.5"><span className="font-medium">{cf.label}:</span> {cf.value}</div>
                            ))}
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {resumeData.sections.skills.length > 0 && (
                    <div className="mb-5">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-indigo-700 border-b border-indigo-200 pb-1 mb-2">
                        Skills
                      </h3>
                      <div className="flex flex-wrap gap-1.5">
                        {resumeData.sections.skills.map((skl) => (
                          <span key={skl.id} className="bg-slate-100 border border-slate-200 text-slate-800 text-xs px-2.5 py-1 rounded inline-flex items-center gap-1">
                            <span>{skl.name}</span> 
                            {skl.category && <span className="text-slate-400 font-normal">({skl.category})</span>}
                            {skl.customFields && skl.customFields.map((cf, cidx) => (
                              cf.label && <span key={cidx} className="text-indigo-600 font-medium ml-1">[{cf.label}: {cf.value}]</span>
                            ))}
                          </span>
                        ))}
                      </div>
                    </div>
                  )}

                  {resumeData.sections.hobbies.length > 0 && (
                    <div>
                      <h3 className="text-xs font-bold uppercase tracking-wider text-indigo-700 border-b border-indigo-200 pb-1 mb-2">
                        Hobbies & Interests
                      </h3>
                      <div className="flex flex-wrap gap-2 text-xs text-slate-700">
                        {resumeData.sections.hobbies.map((hob, idx) => (
                          <span key={hob.id} className="inline-flex items-center gap-1">
                            <span>{hob.name}</span>
                            {hob.customFields && hob.customFields.map((cf, cidx) => (
                              cf.label && <span key={cidx} className="text-indigo-600 font-medium">({cf.label}: {cf.value})</span>
                            ))}
                            {idx < resumeData.sections.hobbies.length - 1 ? ' •' : ''}
                          </span>
                        ))}
                      </div>
                    </div>
                  )}

                </div>
              </div>
            </div>

          </div>

          {/* Help Modal */}
          {showHelpModal && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-slate-700 rounded-xl max-w-lg w-full p-6 space-y-5 text-slate-200 shadow-2xl relative">
                <button 
                  onClick={() => setShowHelpModal(false)} 
                  className="absolute top-4 right-4 text-slate-400 hover:text-white"
                >
                  ✕
                </button>

                <h3 className="text-lg font-bold flex items-center gap-2 text-indigo-400">
                  📖 Guide & Disclaimer
                </h3>

                <div className="space-y-3 text-sm text-slate-300">
                  <div>
                    <h4 className="font-semibold text-white mb-1">How to Use</h4>
                    <ul className="list-disc list-inside space-y-1 text-slate-400 text-xs">
                      <li><strong>Create New:</strong> Clears current workspace to start fresh.</li>
                      <li><strong>Load Old:</strong> Uploads your previous JSON backup file to continue working.</li>
                      <li>Use <strong>"+ Add Field"</strong> to insert custom inputs anywhere.</li>
                      <li>Export your JSON backup before closing the browser.</li>
                    </ul>
                  </div>

                  <div>
                    <h4 className="font-semibold text-white mb-1">🔒 Privacy Disclaimer</h4>
                    <p className="text-xs text-slate-400 leading-relaxed">
                      100% Client-side. Your data never touches a server or external database.
                    </p>
                  </div>
                </div>

                <button 
                  onClick={() => setShowHelpModal(false)}
                  className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-sm font-semibold text-white rounded-lg transition"
                >
                  Got it!
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ResumeBuilder />);
  </script>
</body>
</html>
